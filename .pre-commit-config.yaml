repos:
  # Python code formatter
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        language_version: python3

  # Python linting
  - repo: https://github.com/PyCQA/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
        args:
          - --max-line-length=88
          - --extend-ignore=E203

  # Python import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 10.0.0b2
    hooks:
      - id: isort
        args:
          - --profile=black